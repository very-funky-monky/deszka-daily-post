name: Instagram posztok

on:
  schedule:
    # minden nap 06:00 UTC = 07:00 (tél) / 08:00 (nyár) magyar idő; a GitHub néha késik pár percet
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Célnap (YYYY-MM-DD) - üresen: tegnap"
        required: false
        default: ""
      ignore_focus:
        description: "Teszt: fókusz-szűrés kihagyása (az adott nap minden cikke)"
        type: boolean
        default: false

permissions:
  contents: write   # a képek commitolásához

concurrency:
  group: instagram-posztok
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Függőségek
        run: pip install -r requirements.txt

      - name: Betűtípusok (Urbanist)
        run: python fonts/fetch_fonts.py || echo "::warning::Az Urbanist letöltése nem sikerült, DejaVu tartalék lesz."

      - name: Képek renderelése
        working-directory: src
        env:
          DATE_INPUT: ${{ inputs.date }}
          IGNORE_FOCUS: ${{ inputs.ignore_focus }}
        run: |
          ARGS=""
          if [ -n "$DATE_INPUT" ]; then ARGS="$ARGS --date $DATE_INPUT"; fi
          if [ "$IGNORE_FOCUS" = "true" ]; then ARGS="$ARGS --ignore-focus"; fi
          python main.py render $ARGS

      - name: Képek commitolása és pusholása
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A images/latest
          if ! git diff --cached --quiet; then
            git commit -m "Instagram képek $(date -u +%Y-%m-%d)"
            git push
          fi
          echo "IMAGES_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: E-mail küldése
        working-directory: src
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          DIGEST_EMAIL_TO: ${{ secrets.DIGEST_EMAIL_TO }}
          DIGEST_EMAIL_FROM: ${{ secrets.DIGEST_EMAIL_FROM }}
        run: python main.py send
